<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Casper Score Whipsnade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #060d13;
            color: #f1f5f9;
            overflow-x: hidden;
            position: relative;
        }

        /* Subtle grid pattern overlay */
        .bg-pattern {
            background-color: #060d13;
            background-image: radial-gradient(rgba(16, 185, 129, 0.08) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* Animated Floating Casper Ghosts Background */
        @keyframes floatGhostLeft {
            0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
            50% { transform: translateY(-30px) rotate(6deg) scale(1.05); }
        }

        @keyframes floatGhostRight {
            0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
            50% { transform: translateY(-40px) rotate(-8deg) scale(0.95); }
        }

        .ghost-bg-1 { animation: floatGhostLeft 14s ease-in-out infinite; }
        .ghost-bg-2 { animation: floatGhostRight 18s ease-in-out infinite; }
        .ghost-bg-3 { animation: floatGhostLeft 22s ease-in-out infinite; }

        .glass-card {
            background: rgba(13, 23, 36, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-header {
            background: rgba(8, 15, 24, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Score Badge Custom Styles */
        .badge-pts-0 {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.5);
        }
        .badge-pts-1 {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        .badge-pts-2 {
            background: rgba(255, 255, 255, 0.08);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .badge-pts-3 {
            background: rgba(16, 185, 129, 0.25);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }
        .badge-pts-4 {
            background: rgba(168, 85, 247, 0.3);
            color: #c084fc;
            border: 1px solid rgba(168, 85, 247, 0.5);
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.4);
        }
    </style>
</head>
<body class="bg-pattern min-h-screen pb-8 select-none text-slate-100">

    <!-- Floating Ghost SVGs Background Layer -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <!-- Ghost 1 (Top Right) -->
        <div class="absolute top-10 -right-4 sm:right-10 opacity-15 ghost-bg-1">
            <svg width="180" height="210" viewBox="0 0 200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M100 20C55 20 20 55 20 100C20 150 15 180 30 210C38 225 55 210 65 215C78 222 88 205 100 215C112 205 122 222 135 215C145 210 162 225 170 210C185 180 180 150 180 100C180 55 145 20 100 20Z" fill="url(#ghost-grad-1)"/>
                <ellipse cx="75" cy="85" rx="10" ry="14" fill="#060d13"/>
                <ellipse cx="125" cy="85" rx="10" ry="14" fill="#060d13"/>
                <circle cx="78" cy="81" r="3" fill="#ffffff"/>
                <circle cx="128" cy="81" r="3" fill="#ffffff"/>
                <path d="M88 115 C95 125, 105 125, 112 115" stroke="#060d13" stroke-width="4" stroke-linecap="round" fill="none"/>
                <defs>
                    <linearGradient id="ghost-grad-1" x1="100" y1="20" x2="100" y2="220" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#ffffff" stop-opacity="0.85"/>
                        <stop offset="1" stop-color="#10b981" stop-opacity="0.2"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <!-- Ghost 2 (Mid Left) -->
        <div class="absolute top-1/2 -left-8 opacity-10 ghost-bg-2">
            <svg width="160" height="190" viewBox="0 0 200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M100 20C55 20 20 55 20 100C20 150 15 180 30 210C38 225 55 210 65 215C78 222 88 205 100 215C112 205 122 222 135 215C145 210 162 225 170 210C185 180 180 150 180 100C180 55 145 20 100 20Z" fill="url(#ghost-grad-2)"/>
                <ellipse cx="75" cy="85" rx="8" ry="12" fill="#060d13"/>
                <ellipse cx="125" cy="85" rx="8" ry="12" fill="#060d13"/>
                <circle cx="77" cy="82" r="2.5" fill="#ffffff"/>
                <circle cx="127" cy="82" r="2.5" fill="#ffffff"/>
                <defs>
                    <linearGradient id="ghost-grad-2" x1="100" y1="20" x2="100" y2="220" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#34d399" stop-opacity="0.7"/>
                        <stop offset="1" stop-color="#0284c7" stop-opacity="0.2"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <!-- Ghost 3 (Bottom Right) -->
        <div class="absolute bottom-10 -right-6 opacity-10 ghost-bg-3">
            <svg width="140" height="170" viewBox="0 0 200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M100 20C55 20 20 55 20 100C20 150 15 180 30 210C38 225 55 210 65 215C78 222 88 205 100 215C112 205 122 222 135 215C145 210 162 225 170 210C185 180 180 150 180 100C180 55 145 20 100 20Z" fill="url(#ghost-grad-3)"/>
                <ellipse cx="75" cy="85" rx="8" ry="12" fill="#060d13"/>
                <ellipse cx="125" cy="85" rx="8" ry="12" fill="#060d13"/>
                <defs>
                    <linearGradient id="ghost-grad-3" x1="100" y1="20" x2="100" y2="220" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#f59e0b" stop-opacity="0.6"/>
                        <stop offset="1" stop-color="#10b981" stop-opacity="0.1"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>
    </div>

    <!-- Header Toolbar -->
    <header class="glass-header sticky top-0 z-50 py-3 px-4 shadow-lg">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="p-1.5 bg-emerald-950 text-emerald-400 rounded-xl border border-emerald-600/40 flex items-center justify-center">
                    <svg width="22" height="22" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M100 20C60 20 30 50 30 90C30 135 25 160 40 180C48 190 60 180 70 185C80 190 88 175 100 185C112 175 120 190 130 185C140 180 152 190 160 180C175 160 170 135 170 90C170 50 140 20 100 20Z" fill="#ffffff"/>
                        <ellipse cx="78" cy="78" rx="8" ry="11" fill="#060d13"/>
                        <ellipse cx="122" cy="78" rx="8" ry="11" fill="#060d13"/>
                        <circle cx="80" cy="74" r="2.5" fill="#ffffff"/>
                        <circle cx="124" cy="74" r="2.5" fill="#ffffff"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-base font-extrabold tracking-tight text-white">
                        Casper Score Whipsnade
                    </h1>
                    <p class="text-[10px] text-slate-400 font-medium">WHS Stableford Generator</p>
                </div>
            </div>

            <button onclick="randomizeAll()" title="Randomize Tee & Handicap" class="p-2 text-xs font-semibold rounded-xl bg-slate-800/90 text-slate-300 border border-slate-700 hover:bg-slate-700 active:scale-95 transition-all flex items-center gap-1">
                <i data-lucide="shuffle" class="w-4 h-4 text-emerald-400"></i>
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-3 pt-4 space-y-3.5 relative z-10">

        <!-- Controls Card -->
        <section class="glass-card rounded-2xl p-3.5 space-y-3 border border-slate-800 shadow-xl">
            <!-- Tee Selector & Weather -->
            <div class="grid grid-cols-2 gap-2">
                <div class="space-y-1">
                    <label for="tee-select" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">Tee Set</label>
                    <select id="tee-select" onchange="updateTee(this.value)" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-xl p-2 font-semibold focus:ring-1 focus:ring-emerald-500 outline-none">
                        <option value="white" selected>White Tees (6,723y)</option>
                        <option value="yellow">Yellow Tees (6,399y)</option>
                        <option value="red">Red Tees (5,690y)</option>
                    </select>
                </div>

                <div class="space-y-1">
                    <label for="weather-select" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">Weather</label>
                    <select id="weather-select" onchange="updateWeather(this.value)" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-xl p-2 font-semibold focus:ring-1 focus:ring-emerald-500 outline-none">
                        <option value="calm" selected>☀️ Calm / Ideal</option>
                        <option value="breeze">☁️ Moderate Breeze</option>
                        <option value="windy">🌧️ Strong Winds</option>
                    </select>
                </div>
            </div>

            <!-- Playing Handicap Slider -->
            <div class="space-y-1.5 pt-1 border-t border-slate-800">
                <div class="flex justify-between items-center text-xs">
                    <span class="text-slate-400 font-bold uppercase text-[10px] tracking-wider">Playing Handicap</span>
                    <span id="handicap-val" class="font-extrabold text-emerald-400 text-sm">10</span>
                </div>
                <input type="range" id="handicap-input" min="0" max="24" value="10" step="1" oninput="updateHandicap(this.value)" class="w-full accent-emerald-500 bg-slate-800 h-2 rounded-lg cursor-pointer">
            </div>

            <!-- Simulate Button -->
            <button onclick="simulateRound()" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-extrabold text-xs tracking-wide uppercase shadow-lg shadow-emerald-950/50 flex items-center justify-center gap-2 active:scale-[0.98] transition-all">
                <i data-lucide="ghost" class="w-4 h-4 text-emerald-200"></i>
                Simulate Round
            </button>
        </section>

        <!-- Summary Metric Tiles -->
        <section class="grid grid-cols-2 gap-2.5">
            <!-- Handicap Tile -->
            <div class="glass-card rounded-2xl p-3 text-center border border-slate-800">
                <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">Playing Handicap</span>
                <span id="summary-hcap" class="text-2xl font-black text-slate-100 block mt-0.5">10</span>
            </div>

            <!-- Stableford Points Tile (Gold Accent) -->
            <div class="glass-card rounded-2xl p-3 text-center border border-amber-500/30 bg-gradient-to-br from-slate-900/90 to-amber-950/20 shadow-lg">
                <span class="text-[10px] font-bold uppercase tracking-wider text-amber-400/90 block">Stableford Points</span>
                <div class="flex items-center justify-center gap-1 mt-0.5">
                    <span id="summary-points" class="text-2xl font-black text-amber-400">33</span>
                    <span class="text-xs font-bold text-amber-500">PTS</span>
                </div>
            </div>
        </section>

        <!-- Portrait-Optimized 5-Column Scorecard Table -->
        <section class="glass-card rounded-2xl border border-slate-800 overflow-hidden shadow-xl">
            <div class="px-3 py-2 bg-slate-900/90 border-b border-slate-800 flex justify-between items-center text-[11px]">
                <span class="font-extrabold text-slate-200 flex items-center gap-1.5">
                    <i data-lucide="table" class="w-3.5 h-3.5 text-emerald-400"></i>
                    Scorecard
                </span>
                <span id="active-tee-badge" class="px-2 py-0.5 rounded text-[10px] font-extrabold uppercase bg-slate-100 text-slate-900">
                    White Tees
                </span>
            </div>

            <div class="w-full">
                <table class="w-full text-center border-collapse">
                    <thead>
                        <tr class="bg-slate-900/80 text-[10px] font-extrabold text-slate-400 uppercase border-b border-slate-800">
                            <th class="py-2 px-1 w-[18%]">Hole</th>
                            <th class="py-2 px-1 w-[18%]">Par</th>
                            <th class="py-2 px-1 w-[18%]">SI</th>
                            <th class="py-2 px-1 w-[22%]">Net Score</th>
                            <th class="py-2 px-1 w-[24%] bg-slate-800/40 text-emerald-400">Points</th>
                        </tr>
                    </thead>
                    <tbody id="scorecard-body" class="divide-y divide-slate-800/50 text-xs font-semibold">
                        <!-- Scorecard rows injected via JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script>
        // Whipsnade Park Golf Club Course Master Data
        const COURSE_DATA = {
            white: {
                name: "White Tees",
                par: [5, 4, 3, 5, 4, 5, 3, 4, 4,   4, 5, 4, 3, 4, 4, 4, 3, 5],
                si:  [12, 8, 18, 10, 2, 16, 14, 6, 4,   9, 7, 1, 13, 11, 5, 3, 17, 15]
            },
            yellow: {
                name: "Yellow Tees",
                par: [5, 4, 3, 5, 4, 5, 3, 4, 4,   4, 5, 4, 3, 4, 4, 4, 3, 5],
                // Yellow Tees SI synchronized to match White Tees
                si:  [12, 8, 18, 10, 2, 16, 14, 6, 4,   9, 7, 1, 13, 11, 5, 3, 17, 15]
            },
            red: {
                name: "Red Tees",
                par: [5, 4, 3, 5, 4, 5, 3, 4, 4,   4, 5, 4, 3, 4, 4, 4, 3, 5],
                si:  [14, 10, 18, 8, 2, 12, 16, 6, 4,   9, 3, 1, 13, 11, 5, 7, 17, 15]
            }
        };

        const WEATHER_FACTORS = {
            calm: { blobPenalty: 0.0 },
            breeze: { blobPenalty: 0.08 },
            windy: { blobPenalty: 0.18 }
        };

        let currentTee = 'white';
        let currentHandicap = 10;
        let currentWeather = 'calm';
        let currentRoundScores = [];

        window.onload = function() {
            lucide.createIcons();
            randomizeAll();
        };

        function updateTee(val) {
            currentTee = val;
            const badge = document.getElementById('active-tee-badge');
            badge.textContent = COURSE_DATA[val].name;
            simulateRound();
        }

        function updateHandicap(val) {
            currentHandicap = parseInt(val, 10);
            document.getElementById('handicap-val').textContent = currentHandicap;
            document.getElementById('summary-hcap').textContent = currentHandicap;
            simulateRound();
        }

        function updateWeather(val) {
            currentWeather = val;
            simulateRound();
        }

        function randomizeAll() {
            const randHcp = Math.floor(Math.random() * 25);
            document.getElementById('handicap-input').value = randHcp;
            updateHandicap(randHcp);

            const tees = ['white', 'yellow', 'red'];
            const randTee = tees[Math.floor(Math.random() * tees.length)];
            document.getElementById('tee-select').value = randTee;
            updateTee(randTee);
        }

        function getStrokesAllocated(handicap, strokeIndex) {
            return Math.floor(handicap / 18) + (strokeIndex <= (handicap % 18) ? 1 : 0);
        }

        // WHS Simulation Engine
        function generateSingleRoundData(teeKey, handicap, weatherKey) {
            const course = COURSE_DATA[teeKey];
            const weather = WEATHER_FACTORS[weatherKey];
            const randRoll = Math.random();

            // Macro performance tier (WHS ~18% top tier)
            let category = 'average';
            if (randRoll < 0.18) category = 'top';
            else if (randRoll < 0.73) category = 'average';
            else category = 'off';

            // Target blobs (0 points)
            let targetBlobs = 0;
            if (category === 'top') targetBlobs = Math.random() < 0.8 ? 0 : 1;
            else if (category === 'average') targetBlobs = 1 + (Math.random() < 0.5 ? 1 : 0);
            else targetBlobs = 2 + Math.floor(Math.random() * 3);

            if (weather.blobPenalty > 0 && Math.random() < weather.blobPenalty) {
                targetBlobs += 1;
            }

            // Map blobs to low SI (hard) holes
            let holeIndices = Array.from({length: 18}, (_, i) => i);
            holeIndices.sort((a, b) => course.si[a] - course.si[b]); // Sort by hardest SI

            let blobHoles = new Set();
            for (let i = 0; i < targetBlobs; i++) {
                let idx = Math.floor(Math.pow(Math.random(), 1.4) * holeIndices.length);
                blobHoles.add(holeIndices[idx]);
            }

            let holesResult = [];
            let totalPoints = 0;

            for (let i = 0; i < 18; i++) {
                const par = course.par[i];
                const si = course.si[i];
                const strokesRec = getStrokesAllocated(handicap, si);
                const isBlob = blobHoles.has(i);

                let points = 2;
                if (isBlob) {
                    points = 0;
                } else {
                    const pRoll = Math.random();
                    if (category === 'top') {
                        if (pRoll < 0.12) points = 4;
                        else if (pRoll < 0.45) points = 3;
                        else if (pRoll < 0.88) points = 2;
                        else points = 1;
                    } else if (category === 'average') {
                        if (pRoll < 0.03) points = 4;
                        else if (pRoll < 0.22) points = 3;
                        else if (pRoll < 0.68) points = 2;
                        else points = 1;
                    } else {
                        if (pRoll < 0.10) points = 3;
                        else if (pRoll < 0.45) points = 2;
                        else points = 1;
                    }
                }

                // Net Score calculation relative to Par and Points
                // Net Par = Par (2 pts), Net Birdie = Par - 1 (3 pts), Net Eagle = Par - 2 (4 pts), Net Bogey = Par + 1 (1 pt), Blob = Par + 2 or worse (0 pts)
                let netScore = par;
                if (points === 4) netScore = par - 2;
                else if (points === 3) netScore = par - 1;
                else if (points === 2) netScore = par;
                else if (points === 1) netScore = par + 1;
                else netScore = par + 2; // Blob / Wipeout

                totalPoints += points;

                holesResult.push({
                    hole: i + 1,
                    par: par,
                    si: si,
                    strokesRec: strokesRec,
                    netScore: netScore,
                    points: points
                });
            }

            return { holes: holesResult, totalPoints: totalPoints };
        }

        function simulateRound() {
            const roundData = generateSingleRoundData(currentTee, currentHandicap, currentWeather);
            currentRoundScores = roundData.holes;
            renderScorecard(roundData.totalPoints);
        }

        function renderScorecard(totalPoints) {
            const tbody = document.getElementById('scorecard-body');
            tbody.innerHTML = '';

            let outPar = 0, outPoints = 0;
            let inPar = 0, inPoints = 0;

            currentRoundScores.forEach((row, idx) => {
                const isOut = idx < 9;
                if (isOut) {
                    outPar += row.par;
                    outPoints += row.points;
                } else {
                    inPar += row.par;
                    inPoints += row.points;
                }

                // Points Badge Styling (0, 1, 2, 3, 4)
                let ptBadgeHtml = "";
                if (row.points === 4) {
                    ptBadgeHtml = `<span class="inline-block w-6 h-6 leading-6 rounded-full font-black text-xs badge-pts-4">4</span>`;
                } else if (row.points === 3) {
                    ptBadgeHtml = `<span class="inline-block w-6 h-6 leading-6 rounded-full font-extrabold text-xs badge-pts-3">3</span>`;
                } else if (row.points === 2) {
                    ptBadgeHtml = `<span class="inline-block w-6 h-6 leading-6 rounded-full font-bold text-xs badge-pts-2">2</span>`;
                } else if (row.points === 1) {
                    ptBadgeHtml = `<span class="inline-block w-6 h-6 leading-6 rounded-full font-semibold text-xs badge-pts-1">1</span>`;
                } else {
                    ptBadgeHtml = `<span class="inline-block w-6 h-6 leading-6 rounded-full font-black text-xs badge-pts-0">0</span>`;
                }

                const tr = document.createElement('tr');
                tr.className = row.points === 0 ? "bg-red-950/20" : "hover:bg-slate-800/30";
                tr.innerHTML = `
                    <td class="py-2 px-1 text-slate-200 font-bold">${row.hole}</td>
                    <td class="py-2 px-1 text-slate-400">${row.par}</td>
                    <td class="py-2 px-1 text-slate-400 font-mono">${row.si}</td>
                    <td class="py-2 px-1 text-emerald-400 font-extrabold">${row.netScore}</td>
                    <td class="py-2 px-1 bg-slate-800/20">${ptBadgeHtml}</td>
                `;
                tbody.appendChild(tr);

                // Insert OUT Subtotal Row
                if (idx === 8) {
                    const trOut = document.createElement('tr');
                    trOut.className = "bg-slate-900 font-extrabold text-slate-200 border-y border-slate-700/80";
                    trOut.innerHTML = `
                        <td class="py-2 px-1 text-emerald-400">OUT</td>
                        <td class="py-2 px-1 text-slate-300">${outPar}</td>
                        <td class="py-2 px-1 text-slate-500">—</td>
                        <td class="py-2 px-1 text-slate-500">—</td>
                        <td class="py-2 px-1 bg-slate-800/60 text-amber-400 font-black">${outPoints}</td>
                    `;
                    tbody.appendChild(trOut);
                }

                // Insert IN Subtotal Row
                if (idx === 17) {
                    const trIn = document.createElement('tr');
                    trIn.className = "bg-slate-900 font-extrabold text-slate-200 border-y border-slate-700/80";
                    trIn.innerHTML = `
                        <td class="py-2 px-1 text-emerald-400">IN</td>
                        <td class="py-2 px-1 text-slate-300">${inPar}</td>
                        <td class="py-2 px-1 text-slate-500">—</td>
                        <td class="py-2 px-1 text-slate-500">—</td>
                        <td class="py-2 px-1 bg-slate-800/60 text-amber-400 font-black">${inPoints}</td>
                    `;
                    tbody.appendChild(trIn);
                }
            });

            // Insert TOTAL Row
            const trTotal = document.createElement('tr');
            trTotal.className = "bg-emerald-950/60 font-black text-white border-t-2 border-emerald-500/60";
            trTotal.innerHTML = `
                <td class="py-2.5 px-1 text-emerald-400">TOT</td>
                <td class="py-2.5 px-1 text-slate-200">${outPar + inPar}</td>
                <td class="py-2.5 px-1 text-slate-500">—</td>
                <td class="py-2.5 px-1 text-slate-500">—</td>
                <td class="py-2.5 px-1 bg-emerald-900/60 text-amber-400 text-sm font-black">${totalPoints}</td>
            `;
            tbody.appendChild(trTotal);

            // Update Summary Card
            document.getElementById('summary-points').textContent = totalPoints;
        }
    </script>
</body>
</html>
